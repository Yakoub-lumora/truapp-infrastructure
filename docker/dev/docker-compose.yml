version: '3.8'

services:
  # Next.js Application - Development
  app:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.app
    container_name: trueshot-app-dev
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ../../:/app:cached
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]

  # Worker Service - Development
  worker:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.worker
    container_name: trueshot-worker-dev
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=development
    volumes:
      - ../../lib:/app/lib
      - ../../tsconfig.json:/app/tsconfig.json
    depends_on:
      - app
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "npx", "tsx", "lib/queue/worker-service.ts", "health"]
      interval: 30s
      timeout: 10s
      retries: 3