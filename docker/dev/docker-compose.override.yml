# Development overrides
services:
  app:
    build:
      dockerfile: docker/dev/Dockerfile.app
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ../../:/app:cached
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]

